# Configuración de SonarQube Cloud para RouteZero (se usa con SonarScanner desde la carpeta raíz del repositorio).
# Cómo se ejecuta, paso a paso: docs/03 Ejecución/Sprint 3/Implementación/05 Calidad de código V_1_1_0.md
#
# El token NUNCA va aquí: se pasa con la variable de entorno SONAR_TOKEN.

sonar.organization=nela1901
sonar.projectKey=Nela1901_RouteZero
sonar.projectName=RouteZero
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Código del sistema
sonar.sources=backend/src,backend/scripts,frontend/src,scripts
# Pruebas (no cuentan como código a cubrir)
sonar.tests=backend/tests,frontend/e2e

# Fuera del análisis: documentación, datos, dependencias, resultados generados y las pruebas que viven junto al código.
# `datos_demo.sql` (reinicio de la demostración) y `preparar_cobertura.py` (paso de apoyo del propio análisis) no son código del sistema.
sonar.exclusions=docs/**,backend/data/**,backend/tests_manual/**,backend/scripts/datos_demo.sql,scripts/preparar_cobertura.py,**/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/playwright-report/**,frontend/test-results/**,**/*.test.ts,**/*.test.tsx,frontend/src/tests/**

# Scripts de apoyo (generación del grafo, auditoría de consultas, verificador de enlaces) y el arranque de React no se prueban
# con pruebas unitarias: no se cuentan en la cobertura
sonar.coverage.exclusions=backend/scripts/**,scripts/**,frontend/src/main.tsx

# Reportes de cobertura (se generan antes del análisis y se normalizan con scripts/preparar_cobertura.py)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
