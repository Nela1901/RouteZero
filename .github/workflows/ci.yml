# Integración continua, fase 1 (HT-10): todo lo que no necesita credenciales ni acceso a la base de datos.
# Las pruebas de pytest del backend corren contra la base real de Supabase y se siguen ejecutando en local antes de
# cada Pull Request; llevarlas aquí (fase 2) se reevalúa al terminar todos los sprints.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, pruebas, build y auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: Pruebas de Vitest
        run: npm test -- --reporter=default --reporter=github-actions
      - run: npm run build
      - name: Auditoría de dependencias (sin vulnerabilidades altas ni críticas)
        run: npm audit --audit-level=high

  e2e:
    name: Pruebas de extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Navegador (se guarda en caché entre ejecuciones)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm run e2e:navegador
      - run: npm run test:e2e
      - name: Informe y trazas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: informe-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  backend-seguridad:
    name: Backend (análisis estático y dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: "python -m pip install --only-binary :all: bandit==1.9.4 pip-audit==2.10.1"
      - name: Bandit (sin hallazgos de severidad alta)
        run: python -m bandit -r backend/src -lll
      - name: pip-audit (dependencias del backend)
        run: python -m pip_audit -r backend/requirements.txt
