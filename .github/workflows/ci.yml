# Integración continua (HT-10): verificación de estilo, análisis estático, compilación y validación de dependencias del
# frontend y del backend, más la higiene de la documentación. No necesita credenciales ni acceso a la base de datos.
# Las pruebas (unitarias, de integración y de extremo a extremo) viven en `tests.yml`, y el despliegue en
# `deploy-production.yml`, que solo actúa cuando estas verificaciones y las pruebas terminan en verde.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, compilación y dependencias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Estilo y análisis estático (oxlint)
        run: npm run lint
      - name: Compilación (tsc y vite build)
        run: npm run build
      - name: Auditoría de dependencias de producción (sin vulnerabilidades altas ni críticas)
        run: npm audit --omit=dev --audit-level=high
      # Las herramientas de desarrollo (vite, vitest) se auditan aparte y sin bloquear: el 17-11-2026 `picomatch` (GHSA-fc5q-39xc-vjpf,
      # ReDoS, severidad alta) quedó sin versión corregida, y solo afecta a las herramientas que construyen y prueban la aplicación,
      # no a lo que se despliega. El paso deja el aviso visible en el registro y se vuelve bloqueante al quitar `continue-on-error`.
      - name: Auditoría de dependencias de desarrollo (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (compilación, análisis estático y dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compilación (todos los módulos deben compilar)
        run: python -m compileall -q backend/src
      - run: "python -m pip install --only-binary :all: bandit==1.9.4 pip-audit==2.10.1"
      - name: Bandit (sin hallazgos de severidad alta)
        run: python -m bandit -r backend/src -lll
      - name: pip-audit (dependencias del backend)
        run: python -m pip_audit -r backend/requirements.txt

  repositorio:
    name: Higiene del repositorio y enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sin archivos residuales ni secretos versionados
        run: |
          residuales="$(git ls-files | grep -E '(~$|\.env$|^node_modules/|/node_modules/|playwright-report/|test-results/)' || true)"
          if [ -n "$residuales" ]; then
            echo "::error::Archivos que no deben estar en el repositorio:"
            echo "$residuales"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Enlaces relativos de todos los documentos Markdown
        run: python scripts/verificar_enlaces.py
