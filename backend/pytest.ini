[pytest]
addopts = --cov=src.auth --cov=src.core.security --cov=src.core.database --cov=src.flota --cov=src.clientes --cov=src.conductores --cov=src.pedidos --cov=src.auditoria --cov=src.red_vial --cov=src.algoritmo --cov-report=term-missing -m "not benchmark and not carga"
markers =
    benchmark: mide rendimiento (se ejecuta con -m benchmark)
    carga: prueba de carga con muchos pedidos (se ejecuta con -m carga)
